<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cardápio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Cardápio</h1>

<div class="categorias">
  <button onclick="mostrarCategoria('lanches', this)">Lanches</button>
  <button onclick="mostrarCategoria('bebidas', this)">Bebidas</button>
</div>

<section id="lanches" class="lista ativo">
  <div class="produto">
    <h3>X-Burguer</h3>
    <p>R$ 18,00</p>
    <button onclick="pedirWhatsApp('X-Burguer', 18)">Pedir</button>
  </div>
</section>

<section id="bebidas" class="lista">
  <div class="produto">
    <h3>Refrigerante</h3>
    <p>R$ 6,00</p>
    <button onclick="pedirWhatsApp('Refrigerante', 6)">Pedir</button>
  </div>
</section>

<script src="js/firebase.js"></script>
<script src="js/script.js"></script>
</body>
</html>
