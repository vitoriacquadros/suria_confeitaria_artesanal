<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin - Sûria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script src="js/firebase.js"></script>
<script src="js/admin.js"></script>

</head>

<body>

<h2>⚙️ Painel Administrativo</h2>

<!-- STATUS -->
<section>
  <h3>Status do Delivery</h3>
  <button onclick="abrirLoja()">🟢 Abrir</button>
  <button onclick="fecharLoja()">🔴 Fechar</button>
</section>

<!-- HORÁRIO -->
<section>
  <h3>Horário de Funcionamento</h3>
  <input type="time" id="abre">
  <input type="time" id="fecha">
  <button onclick="salvarHorario()">Salvar horário</button>
</section>

<!-- PRODUTOS -->
<section>
  <h3>Adicionar Produto</h3>

  <input type="text" id="nome" placeholder="Nome do produto">
  <input type="number" id="preco" placeholder="Preço">
  <input type="text" id="categoria" placeholder="Categoria">
  <input type="text" id="descricao" placeholder="Descrição">
  <input type="text" id="foto" placeholder="URL da foto">

  <button onclick="adicionarProduto()">Adicionar</button>
</section>

<script src="admin.js"></script>
</body>
</html>
